<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SocialOS</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#0a0a0f;color:#fff}#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a0f,#1a0a2e)}.auth-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;width:380px;direction:rtl}.auth-box h1{text-align:center;margin-bottom:24px;font-size:28px}.auth-box h1 span{color:#7c3aed}input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;margin-bottom:12px;outline:none}.btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:15px;font-weight:700;cursor:pointer}#dashboard{display:none;height:100vh}.sidebar{width:220px;background:#0f0f1a;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;padding:16px 8px}.logo{font-size:22px;font-weight:900;text-align:center;padding:12px 0 20px}.logo span{color:#7c3aed}.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:#666;margin-bottom:2px}.nav-item:hover,.nav-item.active{background:rgba(124,58,237,.15);color:#a78bfa}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center}.content{flex:1;overflow-y:auto;padding:20px;direction:rtl}.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px;margin-bottom:12px}.error{color:#f87171;font-size:12px;margin-bottom:10px;display:none}</style></head><body><div id="auth"><div class="auth-box"><h1>⚡ Social<span>OS</span></h1><div id="name-field" style="display:none"><input id="reg-name" placeholder="الاسم الكامل"/></div><input id="auth-email" placeholder="البريد الإلكتروني" type="email"/><input id="auth-password" placeholder="كلمة المرور" type="password"/><p id="auth-error" class="error"></p><button class="btn" onclick="handleAuth()">دخول إلى المنصة ←</button><p style="text-align:center;margin-top:12px;font-size:13px;color:#666">ليس لديك حساب؟ <a href="#" onclick="toggleMode()" style="color:#7c3aed">سجّل الآن</a></p></div></div><div id="dashboard" style="display:none;height:100vh;flex-direction:row"><div class="sidebar"><div class="logo">⚡ Social<span>OS</span></div><div class="nav-item active" onclick="showTab('home',this)">⚡ الرئيسية</div><div class="nav-item" onclick="showTab('create',this)">✨ إنشاء محتوى</div><div class="nav-item" onclick="showTab('messages',this)">💬 الرسائل</div><div class="nav-item" onclick="showTab('analytics',this)">📊 التحليلات</div><div class="nav-item" onclick="showTab('ai',this)">🤖 مساعد AI</div><div class="nav-item" onclick="logout()" style="margin-top:auto;color:#dc2626">🚪 خروج</div></div><div class="main"><div class="header"><span id="page-title">⚡ الرئيسية</span><span id="user-name" style="color:#7c3aed"></span></div><div class="content"><div id="tab-home"><div class="card"><h3>مرحباً بك في SocialOS</h3><p style="color:#888;margin-top:8px;font-size:13px">منصة إدارة السوشيال ميديا بالذكاء الاصطناعي</p></div></div><div id="tab-create" style="display:none"><div class="card"><textarea id="post-text" placeholder="اكتب محتواك هنا..." rows="4" style="width:100%;background:transparent;border:none;color:#fff;font-size:14px;outline:none;resize:none"></textarea><button class="btn" style="margin-top:12px" onclick="alert('قريباً - في انتظار موافقة Meta')">🚀 نشر الآن</button></div></div><div id="tab-messages" style="display:none"><div class="card"><p style="color:#888">لا توجد رسائل حتى الآن</p></div></div><div id="tab-analytics" style="display:none"><div class="card"><h3>📊 الإحصائيات</h3><p style="color:#888;margin-top:8px;font-size:13px">ستظهر الإحصائيات بعد ربط حسابات السوشيال ميديا</p></div></div><div id="tab-ai" style="display:none"><div class="card"><textarea id="ai-prompt" placeholder="اسألني أي شيء..." rows="3" style="width:100%;background:transparent;border:none;color:#fff;font-size:14px;outline:none;resize:none"></textarea><button class="btn" style="margin-top:12px" onclick="askAI()">إرسال</button><div id="ai-response" style="margin-top:12px"></div></div></div></div></div></div><script>const API="https://socialos-production-4aa6.up.railway.app";let isLogin=true,currentUser=null;function toggleMode(){isLogin=!isLogin;document.getElementById("name-field").style.display=isLogin?"none":"block";document.querySelector(".btn").textContent=isLogin?"دخول إلى المنصة ←":"إنشاء حساب ←"}async function handleAuth(){const email=document.getElementById("auth-email").value;const password=document.getElementById("auth-password").value;const errEl=document.getElementById("auth-error");errEl.style.display="none";if(!email||!password){errEl.style.display="block";errEl.textContent="ادخل البريد وكلمة المرور";return}try{const url=isLogin?API+"/api/auth/login":API+"/api/auth/register";const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const data=await res.json();if(data.token){currentUser=data.user;localStorage.setItem("token",data.token);document.getElementById("auth").style.display="none";document.getElementById("dashboard").style.display="flex";document.getElementById("user-name").textContent=email}else{errEl.style.display="block";errEl.textContent=data.message||"بيانات خاطئة"}}catch(e){errEl.style.display="block";errEl.textContent="تعذر الاتصال بالسيرفر"}}function showTab(name,el){document.querySelectorAll("[id^=tab-]").forEach(t=>t.style.display="none");document.getElementById("tab-"+name).style.display="block";document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));if(el)el.classList.add("active");const titles={home:"⚡ الرئيسية",create:"✨ إنشاء محتوى",messages:"💬 الرسائل",analytics:"📊 التحليلات",ai:"🤖 مساعد AI"};document.getElementById("page-title").textContent=titles[name]||""}function logout(){currentUser=null;localStorage.removeItem("token");document.getElementById("auth").style.display="flex";document.getElementById("dashboard").style.display="none"}async function askAI(){const prompt=document.getElementById("ai-prompt").value;if(!prompt)return;const resp=document.getElementById("ai-response");resp.innerHTML="<p style=color:#7c3aed>جاري التفكير...</p>";try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":"REMOVED","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:prompt}]})});const d=await res.json();resp.innerHTML="<p style=font-size:13px;line-height:1.7>"+(d.content?.[0]?.text||"حدث خطأ")+"</p>"}catch(e){resp.innerHTML="<p style=color:red>حدث خطأ</p>"}}const token=localStorage.getItem("token");if(token){document.getElementById("auth").style.display="none";document.getElementById("dashboard").style.display="flex"}</script></body></html>
